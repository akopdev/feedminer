[project]
name = "feedminer"
version = "0.1.0"
description = "A short description of the package."
authors = [
    { name = "Akop Kesheshyan", email = "devnull@akop.dev" }
]
maintainers = [
    { name = "Akop Kesheshyan", email = "devnull@akop.dev" }
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "pydantic",
    "beautifulsoup4",
    "lxml",
    "firecrawl-py",
]

[project.optional-dependencies]
dev = [
    "aioresponses",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/akopdev/feedminer"
Repository = "https://github.com/akopdev/feedminer"

[project.scripts]
feedminer = "feedminer.cli:main"

[pytest]
mock_use_standalone_module = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = "tests/"

[tool.ruff]
exclude = [
    ".venv",
    "build",
    "dist",
    "migrations",
    "__init__.py"
]
include = ["*.py", "*.pyx"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = [
  "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
